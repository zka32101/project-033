<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>お支払いについて | 安心企業研修</title>
<style>
  :root { --bg:#f6f9ff; --card:#fff; --text:#1c2733; --sub:#52606d; --accent:#216488; --line:#d8e2ec; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10161c; --card:#19222b; --text:#e8eef3; --sub:#a3b1bd; --accent:#7fc3e8; --line:#2b3947; }
  }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:560px; margin:0 auto; padding:48px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 24px; }
  h1 { font-size:1.25rem; margin:0 0 12px; color:var(--accent); }
  p { line-height:1.8; margin:8px 0; }
  .sub { color:var(--sub); font-size:.9rem; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1 id="title">アプリにお戻りください</h1>
    <p id="lead"><strong>安心企業研修アプリに戻って</strong>、ご契約の状態をご確認ください。</p>
    <p class="sub" id="note">契約の反映には、数分かかることがあります。アプリで「ご契約について」を開き直すと、最新の状態になります。</p>
  </div>
</main>
<script>
  (function () {
    var r = new URLSearchParams(location.search).get('checkout');
    if (r === 'success') {
      document.getElementById('title').textContent = 'お支払いの手続きが完了しました';
      document.getElementById('lead').innerHTML = 'お申し込みありがとうございました。<strong>安心企業研修アプリに戻って</strong>、ご契約の状態をご確認ください。';
    } else if (r === 'cancel') {
      document.getElementById('title').textContent = 'お支払いは完了していません';
      document.getElementById('lead').textContent = 'お手続きを取りやめました。料金は発生していません。続ける場合は、アプリに戻って「ご契約について」からもう一度お進みください。';
      document.getElementById('note').textContent = 'ご不明な点があれば、運営までお問い合わせください。';
    }
  })();
</script>
</body>
</html>
