name: Analyze & Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

  rules:
    name: Firestore Rules Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rules_test/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run rules tests on the Firestore emulator
        run: npm test
