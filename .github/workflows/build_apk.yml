name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "ビルドモード"
        required: false
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - main

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not set. Add it in repo Settings > Secrets and variables > Actions (base64 of android/app/google-services.json) — required now that the google-services Gradle plugin is applied."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test

      - name: Determine build mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.build_mode }}"
          if [ -z "$MODE" ]; then
            MODE="release"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: flutter build apk --${{ steps.mode.outputs.mode }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ steps.mode.outputs.mode }}-apk
          path: build/app/outputs/flutter-apk/app-${{ steps.mode.outputs.mode }}.apk
          retention-days: 30
